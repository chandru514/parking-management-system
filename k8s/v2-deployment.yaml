apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-system-v2
  labels:
    app: parking-system
    version: v2
    author: "24MIS0514"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parking-system
      version: v2
  template:
    metadata:
      labels:
        app: parking-system
        version: v2
    spec:
      containers:
      - name: parking-v2
        image: chandru514/parking-system:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5002
        env:
        - name: PORT
          value: "5002"
---
apiVersion: v1
kind: Service
metadata:
  name: parking-service-v2
  labels:
    app: parking-system
    version: v2
spec:
  type: NodePort
  selector:
    app: parking-system
    version: v2
  ports:
  - name: http
    port: 5002
    targetPort: 5002
    nodePort: 30002
