apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-system-v3
  labels:
    app: parking-system
    version: v3
    author: "24MIS0514"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parking-system
      version: v3
  template:
    metadata:
      labels:
        app: parking-system
        version: v3
    spec:
      containers:
      - name: parking-v3
        image: chandru514/parking-system:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5003
        env:
        - name: PORT
          value: "5003"
---
apiVersion: v1
kind: Service
metadata:
  name: parking-service-v3
  labels:
    app: parking-system
    version: v3
spec:
  type: NodePort
  selector:
    app: parking-system
    version: v3
  ports:
  - name: http
    port: 5003
    targetPort: 5003
    nodePort: 30003
