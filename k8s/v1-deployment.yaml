apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-system-v1
  labels:
    app: parking-system
    version: v1
    author: "24MIS0514"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parking-system
      version: v1
  template:
    metadata:
      labels:
        app: parking-system
        version: v1
    spec:
      containers:
      - name: parking-v1
        image: chandru514/parking-system:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        env:
        - name: PORT
          value: "5001"
---
apiVersion: v1
kind: Service
metadata:
  name: parking-service-v1
  labels:
    app: parking-system
    version: v1
spec:
  type: NodePort
  selector:
    app: parking-system
    version: v1
  ports:
  - name: http
    port: 5001
    targetPort: 5001
    nodePort: 30001
